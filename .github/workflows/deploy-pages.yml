# Automatyczny deploy na GitHub Pages.
# Po każdym pushu do gałęzi main strona zostaje opublikowana pod adresem
# https://<twoj-login>.github.io/<nazwa-repo>/
#
# Wymaga: w ustawieniach repo → Settings → Pages → Source = "GitHub Actions".

name: Deploy do GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Spakuj artefakt (cały folder, bez _dev)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy na Pages
        id: deployment
        uses: actions/deploy-pages@v4
